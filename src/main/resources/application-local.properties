# ===============================
# Développement local
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/prism_bd
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Pool : échouer plutôt que pendre indéfiniment si MySQL est saturé.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=8000

# Flyway désactivé en local par défaut (ddl-auto=update). Test prod-like : SPRING_FLYWAY_ENABLED=true + ddl-auto=validate
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}

server.port=${SERVER_PORT:8080}

jwt.secret=${JWT_SECRET:DCSPA-DTSI-MENA-2026@@@PRISM}

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param

app.cors.allowed-origin-patterns[0]=http://localhost:*
app.cors.allowed-origin-patterns[1]=http://127.0.0.1:*
