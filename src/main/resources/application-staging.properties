# ===============================
# Tomcat / VPS (staging / prod)
# Adapter les secrets via variables d'environnement ou catalina.properties.
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/prism_bd}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:prism_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Sous Tomcat, le port est celui du connecteur ; cette ligne reste utile en test local avec profil staging.
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/ipt/prism}

jwt.secret=${JWT_SECRET}

server.error.include-message=on_param
server.error.include-binding-errors=on_param
server.error.include-stacktrace=never

# Remplacer par l’URL du front Angular (HTTPS). Ex. : https://monserveur.ci
app.cors.allowed-origin-patterns[0]=https://VOTRE_DOMAINE
