# ===============================
# Tomcat / VPS (staging / prod)
# Adapter les secrets via variables d'environnement ou catalina.properties.
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/prism_bd}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:prism_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:P@ssword1}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Sous Tomcat, le port est celui du connecteur ; utile en test local avec profil staging.
server.port=${SERVER_PORT:8080}
# Déployé en WAR : le chemin public HTTP est défini par Tomcat (nom du WAR, ex. prism.war → /prism).
# Apache :91 mappe /dcspa/api/* vers http://127.0.0.1:8081/prism/api/* (même vhost que Dismas /dismas-api/)

jwt.secret=${JWT_SECRET}

server.error.include-message=on_param
server.error.include-binding-errors=on_param
server.error.include-stacktrace=never

# Front servi sur Apache :91 (ex. http://154.0.30.233:91/dcspa/). Wildcard port si besoin.
app.cors.allowed-origin-patterns[0]=http://154.0.30.233:91
app.cors.allowed-origin-patterns[1]=http://154.0.30.233:*
