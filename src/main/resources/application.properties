spring.application.name=prism

# Profil par défaut si aucune variable SPRING_PROFILES_ACTIVE (IDE, mvn spring-boot:run).
# Sur le serveur : export SPRING_PROFILES_ACTIVE=staging (ou -Dspring.profiles.active=staging).
# spring.profiles.default=local
spring.profiles.default=staging

# ===============================
# Commun à tous les profilsI
# ===============================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Flyway : migrations SQL au démarrage (staging/prod). Désactivé par défaut (local utilise ddl-auto=update).
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
# Procédures MySQL (V1) : hors transaction unique
spring.flyway.execute-in-transaction=false

jwt.expiration-ms=86400000

# Catalogue RBAC : menu + activités centre uniquement (pas une fonctionnalité par route API).
prism.rbac.auto-api-fonctionnalites=false

# Centre technique pour le catalogue « Langues d'apprentissage » (Paramétrage).
# Si vide : premier centre en base. Ex. prism.langue-catalogue.centre-id=1
# prism.langue-catalogue.centre-id=

logging.level.com.dcspa.prism=INFO
logging.level.org.springframework.web.server.adapter=INFO
logging.level.org.springframework.core.codec=INFO
