spring.application.name=prism

# ===============================
# DATASOURCE
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/prism_bd
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# SERVER
# ===============================
# Par défaut 8080 ; si occupé : SERVER_PORT=8081 ou -Dserver.port=8081
server.port=${SERVER_PORT:8080}

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET:DCSPA-DTSI-MENA-2026@@@PRISM}
jwt.expiration-ms=86400000

# ===============================
# ERROR DETAILS DANS LES REPONSES HTTP
# ===============================
# Inclut le message + binding/validation errors dans le JSON d'erreur (utile en dev)
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param

# ===============================
# LOGGING
# ===============================
logging.level.com.dcspa.prism=INFO
# Active pour debugger les erreurs de desérialisation / mapping
logging.level.org.springframework.web.server.adapter=INFO
logging.level.org.springframework.core.codec=INFO
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
