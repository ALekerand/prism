# =============================================================================
# PRISM (DCSPA) — à inclure depuis /etc/apache2/sites-available/base.conf
# Copier ce bloc AVANT les Include ui.conf / admin.conf (ou juste après dismas-api)
# =============================================================================
# Front public : http://154.0.30.233/dcspa/
# API publique : http://154.0.30.233/dcspa/api/...
# Backend      : http://127.0.0.1:8081/prism/api/...  (tomcat-prism, Java 21)
# Fichiers     : /var/www/dcspa/
# =============================================================================

ProxyPreserveHost On

# API — même principe que /dismas-api/ dans base.conf (ligne ~8080)
ProxyPass        /dcspa/api/ http://127.0.0.1:8081/prism/api/
ProxyPassReverse /dcspa/api/ http://127.0.0.1:8081/prism/api/

# Front Angular (build staging, baseHref /dcspa/)
Alias /dcspa /var/www/dcspa
<Directory /var/www/dcspa>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    RewriteEngine On
    RewriteBase /dcspa/
    RewriteRule ^index\.html$ - [L]
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule . /dcspa/index.html [L]
</Directory>
