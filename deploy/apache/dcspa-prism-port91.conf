# =============================================================================
# Fichier VPS : /etc/apache2/sites-available/dcspa.conf
# Activer : sudo a2ensite dcspa.conf && sudo systemctl reload apache2
# Prérequis : Listen 91 dans /etc/apache2/ports.conf
# =============================================================================
# Utiliser ce fichier SEULEMENT si l'accès public passe par :91
# (pare-feu / reverse proxy externe). Sinon préférer le snippet port 80.
# =============================================================================

<VirtualHost *:91>
    ServerName 154.0.30.233

    ProxyPreserveHost On

    <Location /dcspa/api/>
        ProxyPass http://127.0.0.1:8081/prism/api/
        ProxyPassReverse http://127.0.0.1:8081/prism/api/
    </Location>

    Alias /dcspa /var/www/dcspa
    <Directory /var/www/dcspa>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteBase /dcspa/
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /dcspa/index.html [L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/dcspa-91-error.log
    CustomLog ${APACHE_LOG_DIR}/dcspa-91-access.log combined
</VirtualHost>
